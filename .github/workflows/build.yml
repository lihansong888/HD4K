name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Build release APK
        env:
          HD4K_VERSION_CODE: ${{ github.run_number }}
          HD4K_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Collect
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/hd4k-latest.apk
          cp out/hd4k-latest.apk out/hd4k-1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: hd4k-apk, path: out/*.apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest out/hd4k-latest.apk out/hd4k-1.0.${{ github.run_number }}.apk \
            --prerelease --target ${{ github.sha }} --title "最新测试版 1.0.${{ github.run_number }}" \
            --notes "自动构建 #${{ github.run_number }}"
