name: fusion-build

on:
  push:
    branches: [fusion-dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use fixed debug signing key (keeps device id stable across builds)
        run: |
          mkdir -p ~/.android
          cp keystore/fusiontv-debug.keystore ~/.android/debug.keystore

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build python64 debug
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePython64Debug --no-daemon --stacktrace

      - name: List APKs
        run: find . -name '*.apk' | sort

      - name: Inspect APK
        continue-on-error: true
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          A=$(find . -name 'TVBox_debug-python64.apk' | head -n1)
          echo "=== BADGING"; "$BT/aapt" dump badging "$A" | grep -E "package:|sdkVersion|targetSdk|native-code|application-debuggable|maxSdk|uses-feature|compileSdk" | head -30
          echo "=== PERMISSIONS"; "$BT/aapt" dump permissions "$A" | head -40
          echo "=== SIGN"; "$BT/apksigner" verify --verbose --print-certs "$A" 2>&1 | head -12
          echo "=== ZIPALIGN"; "$BT/zipalign" -c -v 4 "$A" 2>&1 | tail -3
          echo "=== MANIFEST HEAD"; "$BT/aapt" dump xmltree "$A" AndroidManifest.xml | head -60
          echo "=== BIG FILES"; unzip -l "$A" | sort -k1 -n -r | head -8

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=$(find . -name 'TVBox_debug-python64.apk' | head -n1)
          echo "$A"
          cp "$A" fusiontv-python64.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest fusiontv-python64.apk --prerelease --title "Test build" --notes "Debug test build from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
