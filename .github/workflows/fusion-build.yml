name: fusion-build

on:
  push:
    branches: [fusion-dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build python64 debug
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePython64Debug --no-daemon --stacktrace

      - name: List APKs
        run: find . -name '*.apk' | sort

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=$(find . -name '*ython64*ebug*.apk' | head -n1)
          echo "$A"
          cp "$A" fusiontv-python64.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest fusiontv-python64.apk --prerelease --title "Test build" --notes "Debug test build from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
